<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DKT Lab</title>
  <meta name="description" content="BKT vs DKT on public knowledge-tracing datasets, with a live in-browser explainer." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='6' width='4' height='9' fill='%232f6fb0'/%3E%3Crect x='6' y='2' width='4' height='13' fill='%23c2562b'/%3E%3Crect x='11' y='9' width='4' height='6' fill='%23777'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">DKT Lab</span>
      <span class="brand-sub">BKT vs DKT on public data</span>

</html>
